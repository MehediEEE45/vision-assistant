name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The two policy gates run first and take seconds. They are the fastest
      # signal that a change has broken an invariant that matters:
      #   checkArchitecture   - a feature reached an output module directly,
      #                         which would make the priority ladder a lie
      #   checkSafetyLanguage - a string promises the user something is safe
      - name: Policy gates
        run: ./gradlew checkArchitecture checkSafetyLanguage --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
