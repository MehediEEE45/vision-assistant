[platformio]
default_envs = weact_h743_dfu

[env]
platform = ststm32@19.5.0
board = weact_mini_h743vitx
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -I ../include
    ; The Arduino core leaves the camera interface out of its HAL build.
    -D HAL_DCMI_MODULE_ENABLED
    -Wall
lib_deps =
    pololu/VL53L1X@1.3.1
    pololu/VL53L0X@1.3.1

[env:weact_h743_dfu]
; USB DFU. The script restarts a running board into DFU first, so Upload
; needs no button presses, and writes with STM32CubeProgrammer if installed.
upload_protocol = custom
extra_scripts = pre:tools/pio_dfu_reset.py

[env:weact_h743_stlink]
upload_protocol = stlink
